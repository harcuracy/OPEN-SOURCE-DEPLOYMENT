version: "3.8"

services:
  gateway:
    build:
      context: ./services/gateway
    container_name: ai_gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      - GATEWAY_PORT=8000
      - API_KEY=${API_KEY:-tingo-master-key-1234567890abcdef}
      - RATE_LIMIT=${RATE_LIMIT:-60/minute}
      - LLM_SERVICE_URL=http://llm_service:8002
      - TTS_SERVICE_URL=http://tts_service:8003
      - STT_SERVICE_URL=http://stt_service:8004
    depends_on:
      - llm_service
      - tts_service
      - stt_service

  llm_service:
    build:
      context: ./services/llm_service
    container_name: ai_llm_service
    restart: unless-stopped
    ports:
      - "${LLM_PORT:-8002}:8002"
    volumes:
      - ./models:/app/models
    environment:
      - LLM_PORT=8002
      - MODELS_DIR=/app/models
      - MAX_LOADED_MODELS=${MAX_LOADED_MODELS:-2}
      - MODEL_N_THREADS=${MODEL_N_THREADS:-8}
      - MODEL_N_GPU_LAYERS=${MODEL_N_GPU_LAYERS:-0}
      - MODEL_N_CTX=${MODEL_N_CTX:-4096}
      - MODEL_MISTRAL_PATH=/app/models/mistral-7b-instruct-v0.2.Q4_K_M.gguf
      - MODEL_CODER_PATH=/app/models/qwen2.5-coder-7b-instruct.Q4_K_M.gguf
      - MODEL_FAST_PATH=/app/models/phi-3-mini-4k-instruct.Q4_K_M.gguf
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  tts_service:
    build:
      context: ./services/tts_service
    container_name: ai_tts_service
    restart: unless-stopped
    ports:
      - "${TTS_PORT:-8003}:8003"
    volumes:
      - ./models:/app/models
    environment:
      - TTS_PORT=8003
      - KOKORO_MODEL_PATH=/app/models/kokoro/kokoro-v0_19.onnx
      - KOKORO_VOICES_PATH=/app/models/kokoro/voices-v1.0.bin
      - KOKORO_DEFAULT_VOICE=af_heart

  stt_service:
    build:
      context: ./services/stt_service
    container_name: ai_stt_service
    restart: unless-stopped
    ports:
      - "${STT_PORT:-8004}:8004"
    volumes:
      - ./models:/app/models
    environment:
      - STT_PORT=8004
      - WHISPER_MODEL=${WHISPER_MODEL:-small.en}
      - WHISPER_DEVICE=${WHISPER_DEVICE:-auto}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
